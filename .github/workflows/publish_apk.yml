name: Publish APK
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'CI run id to publish'
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Download APK from the CI run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.inputs.run_id || github.event.workflow_run.id }}
        run: |
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'Kodomo-*' --dir apk
          find apk -name '*.apk' -exec cp {} . \;
          ls -l *.apk

      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.inputs.run_id || github.event.workflow_run.id }}
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest *.apk --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Kodomo latest build" \
            --notes "Built by CI run $RUN_ID. Page translation is untested on a real device."
